{% extends "consultas/base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h4 class="card-title mb-3">Criar conta</h4>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
                </form>
                <p class="mt-3 mb-0">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
