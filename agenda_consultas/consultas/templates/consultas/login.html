{% extends "consultas/base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body">
                <h4 class="card-title mb-3">Entrar</h4>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
                <p class="mt-3 mb-0">Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
